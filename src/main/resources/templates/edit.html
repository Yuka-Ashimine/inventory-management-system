<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>商品編集</title>
</head>
<body>
<form action="/update" method="post" th:object="${item}">

    <input type="hidden" th:field="*{id}">
    商品名:
    <input type="text" th:field="*{name}">
    <p class="error"
       th:if="${#fields.hasErrors('name')}"
       th:errors="*{name}">
    </p>
    <br>
    カテゴリ:
    <input type="text" th:field="*{category}">
    <p class="error"
       th:if="${#fields.hasErrors('category')}"
       th:errors="*{category}">
    </p>
    <br>
    価格:
    <input type="number" th:field="*{price}">
    <p class="error"
       th:if="${#fields.hasErrors('price')}"
       th:errors="*{price}">
    </p>
    <br>
    在庫:
    <input type="number" th:field="*{stock}">
    <p class="error"
       th:if="${#fields.hasErrors('stock')}"
       th:errors="*{stock}">
    </p>
    <br>
    <button type="submit">更新</button>
</form>
<a href="/">一覧へ戻る</a>
</body>
</html>
